
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My TV</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 4vw;
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
}
h1 { font-size: clamp(30px, 5vw, 48px); margin: 0 0 8px; }
p { color: #aab4c8; font-size: clamp(16px, 2vw, 22px); }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 30px;
  max-width: 1000px;
}
a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 140px;
  padding: 18px 8px;
  border: 2px solid #343e54;
  border-radius: 14px;
  background: #242a38;
  color: white;
  text-decoration: none;
  font-size: clamp(16px, 2.3vw, 24px);
}
a:focus, a:hover {
  outline: none;
  border-color: #8db8ff;
  background: #343e54;
}
.icon { font-size: clamp(32px, 5vw, 48px); margin-bottom: 10px; }
</style>
</head>
<body>
<script>
(function () {
  const tiles = Array.from(document.querySelectorAll('.grid a'));
  if (!tiles.length) return;

  let selected = 0;
  const cols = 3;

  function highlight() {
    tiles.forEach((tile, i) => {
      tile.style.outline = i === selected ? '4px solid #8db8ff' : 'none';
      tile.style.background = i === selected ? '#343e54' : '#242a38';
    });
  }

  document.addEventListener('keydown', function (e) {
    let k = e.key || '';
    let c = e.keyCode || e.which;

    if (k === 'ArrowRight' || c === 39) {
      selected = Math.min(selected + 1, tiles.length - 1);
    } else if (k === 'ArrowLeft' || c === 37) {
      selected = Math.max(selected - 1, 0);
    } else if (k === 'ArrowDown' || c === 40) {
      selected = Math.min(selected + cols, tiles.length - 1);
    } else if (k === 'ArrowUp' || c === 38) {
      selected = Math.max(selected - cols, 0);
    } else if (k === 'Enter' || c === 13) {
      e.preventDefault();
      tiles[selected].click();
      return;
    } else {
      return;
    }

    e.preventDefault();
    highlight();
  });

  highlight();
})();
</script>

</html>
