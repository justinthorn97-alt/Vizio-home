
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My TV</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 4vw;
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
}
h1 { font-size: clamp(30px, 5vw, 48px); margin: 0 0 8px; }
p { color: #aab4c8; font-size: clamp(16px, 2vw, 22px); }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 30px;
  max-width: 1000px;
}
a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 140px;
  padding: 18px 8px;
  border: 2px solid #343e54;
  border-radius: 14px;
  background: #242a38;
  color: white;
  text-decoration: none;
  font-size: clamp(16px, 2.3vw, 24px);
}
a:focus, a:hover {
  outline: none;
  border-color: #8db8ff;
  background: #343e54;
}
.icon { font-size: clamp(32px, 5vw, 48px); margin-bottom: 10px; }
</style>
</head>
<body>
<script>
(function () {
  const tiles = Array.from(document.querySelectorAll('.grid a'));
  if (!tiles.length) return;

  let selected = 0;

  function highlight() {
    tiles.forEach((tile, i) => {
      tile.style.outline = i === selected ? '4px solid #8db8ff' : 'none';
      tile.style.background = i === selected ? '#343e54' : '#242a38';
    });
  }

  function move(direction) {
    const current = tiles[selected].getBoundingClientRect();
    let best = -1;
    let bestScore = Infinity;

    tiles.forEach((tile, i) => {
      if (i === selected) return;
      const r = tile.getBoundingClientRect();
      const dx = (r.left + r.width / 2) - (current.left + current.width / 2);
      const dy = (r.top + r.height / 2) - (current.top + current.height / 2);

      let primary, secondary;
      if (direction === 'ArrowRight') {
        if (dx <= 5) return;
        primary = dx; secondary = Math.abs(dy);
      } else if (direction === 'ArrowLeft') {
        if (dx >= -5) return;
        primary = -dx; secondary = Math.abs(dy);
      } else if (direction === 'ArrowDown') {
        if (dy <= 5) return;
        primary = dy; secondary = Math.abs(dx);
      } else {
        if (dy >= -5) return;
        primary = -dy; secondary = Math.abs(dx);
      }

      const score = primary + secondary * 2;
      if (score < bestScore) {
        bestScore = score;
        best = i;
      }
    });

    if (best >= 0) selected = best;
    highlight();
  }

  document.addEventListener('keydown', function (event) {
    if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(event.key)) {
      event.preventDefault();
      move(event.key);
    } else if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      tiles[selected].click();
    }
  });

  highlight();
})();
</script>

</script>

</body>
</html>
