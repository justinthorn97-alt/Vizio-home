
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My TV</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 4vw;
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
}
h1 { font-size: clamp(30px, 5vw, 48px); margin: 0 0 8px; }
p { color: #aab4c8; font-size: clamp(16px, 2vw, 22px); }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 30px;
  max-width: 1000px;
}
a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 140px;
  padding: 18px 8px;
  border: 2px solid #343e54;
  border-radius: 14px;
  background: #242a38;
  color: white;
  text-decoration: none;
  font-size: clamp(16px, 2.3vw, 24px);
}
a:focus, a:hover {
  outline: none;
  border-color: #8db8ff;
  background: #343e54;
}
.icon { font-size: clamp(32px, 5vw, 48px); margin-bottom: 10px; }
</style>
</head>
<body>
<script>
(function () {
  const tiles = Array.from(document.querySelectorAll('.grid a'));
  const panel = document.createElement('div');

  panel.style.cssText =
    'position:fixed;top:10px;left:10px;z-index:99999;' +
    'background:#111;color:#fff;padding:14px;border:3px solid #8db8ff;' +
    'font:18px Arial;min-width:260px;border-radius:8px;';

  panel.innerHTML =
    '<b>REMOTE KEY TEST</b><div id="keyname">Press a remote button</div>' +
    '<div id="keycode"></div><div id="keywhich"></div>';

  document.body.appendChild(panel);

  function showKey(e) {
    document.getElementById('keyname').textContent = 'key: ' + e.key;
    document.getElementById('keycode').textContent = 'code: ' + e.code;
    document.getElementById('keywhich').textContent =
      'keyCode: ' + (e.keyCode || e.which);
  }

  document.addEventListener('keydown', showKey, true);
  document.addEventListener('keyup', showKey, true);
})();
</script>


</html>
